<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novo registro de estudo — Evolv</title>
<script>try{var t=localStorage.getItem('evolv:theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23000'/%3E%3Ctext x='50' y='67' font-size='54' font-family='Arial' fill='%23fff' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<nav id="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">Evolv</a>
    <div class="nav-links">
      <a href="dashboard.html">Painel</a>
      <a href="index.html#subjects">Disciplinas</a>
    </div>
    <div class="nav-right">
      <button class="theme-btn" data-act="theme" title="Alternar tema">◐</button>
    </div>
  </div>
</nav>

<main class="app-main">
  <div class="container" style="max-width:600px">
    <a class="back-link" href="javascript:history.back()">‹ Voltar</a>
    <div class="page-head"><div><h1>Novo registro de estudo</h1><p>Registre uma sessão para alimentar seus gráficos de evolução.</p></div></div>

    <div class="card">
      <div class="subject-ctx" id="subjectCtx"></div>
      <form id="logForm" class="form-card">
        <div class="field">
          <label for="subjectSelect">Disciplina</label>
          <select id="subjectSelect" required></select>
        </div>
        <div class="field">
          <label for="date">Data</label>
          <input id="date" type="date" required>
        </div>
        <div class="field">
          <label for="minutes">Duração (minutos)</label>
          <input id="minutes" type="number" min="1" placeholder="Ex: 45" required>
        </div>
        <div class="field">
          <label for="content">O que você estudou?</label>
          <input id="content" maxlength="160" placeholder="Ex: Exercícios de recursividade">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn block">Registrar sessão</button>
        </div>
      </form>
    </div>
  </div>
</main>

<script src="js/core/utils.js"></script>
<script src="js/core/state.js"></script>
<script src="js/data/database.js"></script>
<script src="js/services/services.js"></script>
<script src="js/ui/reveal.js"></script>
<script src="js/pages/add-log.js"></script>
</body>
</html>
