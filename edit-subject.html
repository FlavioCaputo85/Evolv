<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editar matéria — Evolv</title>
<script>try{var t=localStorage.getItem('evolv:theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23000'/%3E%3Ctext x='50' y='67' font-size='54' font-family='Arial' fill='%23fff' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<nav id="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">Evolv</a>
    <div class="nav-links">
      <a href="dashboard.html">Painel</a>
      <a href="about.html">Sobre</a>
    </div>
    <div class="nav-right">
      <button class="theme-btn" data-act="theme" title="Alternar tema">◐</button>
      <span data-auth="out" style="display:none"><a href="login.html" class="nav-cta">Entrar</a></span>
      <span data-auth="in" style="display:none;align-items:center;gap:12px">
        <a href="profile.html" class="nav-avatar" id="navAvatar">?</a>
        <a href="javascript:void(0)" class="nav-logout" data-act="logout">Sair</a>
      </span>
    </div>
  </div>
</nav>

<main class="app-main">
  <div class="container" style="max-width:600px">
    <a class="back-link" href="javascript:history.back()">‹ Voltar</a>
    <div class="page-head"><div><h1>Editar matéria</h1><p>Altere o nome, a descrição ou a cor da disciplina.</p></div></div>

    <div class="card">
      <form id="subjectForm" class="form-card">
        <div class="field">
          <label for="name">Nome da matéria</label>
          <input id="name" maxlength="60" required>
        </div>
        <div class="field">
          <label for="blurb">Descrição (opcional)</label>
          <input id="blurb" maxlength="120">
        </div>
        <div class="field">
          <label>Cor</label>
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn block">Salvar alterações</button>
        </div>
      </form>
      <div class="mt" style="border-top:1px solid var(--line);padding-top:18px">
        <button type="button" class="btn ghost block" id="deleteBtn" style="color:var(--bad)">Excluir matéria</button>
      </div>
    </div>
  </div>
</main>

<script src="js/core/utils.js"></script>
<script src="js/core/state.js"></script>
<script src="js/data/database.js"></script>
<script src="js/services/auth.js"></script>
<script src="js/services/services.js"></script>
<script src="js/ui/reveal.js"></script>
<script src="js/pages/edit-subject.js"></script>
</body>
</html>
