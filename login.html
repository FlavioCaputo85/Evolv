<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar — Evolv</title>
<script>try{var t=localStorage.getItem('evolv:theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23000'/%3E%3Ctext x='50' y='67' font-size='54' font-family='Arial' fill='%23fff' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<nav id="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">Evolv</a>
    <div class="nav-links"></div>
    <div class="nav-right">
      <button class="theme-btn" data-act="theme" title="Alternar tema">◐</button>
    </div>
  </div>
</nav>

<main class="auth-shell">
  <div class="auth-card">
    <h1>Entrar</h1>
    <p>Acesse seu painel de estudos.</p>

    <form id="loginForm" class="form-card">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="voce@email.com" required>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" required>
      </div>
      <div class="form-error" id="formError"></div>
      <div class="form-actions">
        <button type="submit" class="btn block">Entrar</button>
      </div>
    </form>

    <div class="auth-switch">Ainda não tem conta? <a href="signup.html">Criar conta</a></div>
  </div>
</main>

<script src="js/core/utils.js"></script>
<script src="js/core/state.js"></script>
<script src="js/data/database.js"></script>
<script src="js/services/auth.js"></script>
<script src="js/ui/reveal.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
